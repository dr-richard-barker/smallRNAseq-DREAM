name: smallrnaseq-dream
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  - bowtie=1.3.1
  - viennarna=2.6.4
  - samtools
  - blast
  - sra-tools
  - seqkit
  - trim-galore
  - kraken2
  - mirdeep2
  - bioconductor-deseq2
  - bioconductor-edger
  - pandas
  - biopython
  # Java (for sRNAtoolbox JARs) and Nextflow (for nf-core/smrnaseq):
  - openjdk>=11
  - nextflow>=20.04.0
  # miRDeep-P2 and sRNAtoolbox are installed separately — see third_party/README.md
